<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="og" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#FFD000"/>
      <stop offset="55%" stop-color="#FF7700"/>
      <stop offset="100%" stop-color="#FF4400"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4FCC"/>
      <stop offset="100%" stop-color="#0D1E6A"/>
    </linearGradient>
  </defs>
  <!-- "3" orange -->
  <text x="4" y="76" font-family="Arial Black, Helvetica, sans-serif" font-weight="900"
        font-size="76" fill="url(#og)" letter-spacing="-2">3</text>
  <!-- "T" dark blue, offset slightly left to overlay "3" -->
  <text x="46" y="76" font-family="Arial Black, Helvetica, sans-serif" font-weight="900"
        font-size="76" fill="url(#bg)" letter-spacing="-2">T</text>
  <!-- Digital pixel dots top-right -->
  <rect x="76" y="8"  width="7" height="7" rx="1.5" fill="#2B6AE8" opacity="0.9"/>
  <rect x="86" y="14" width="6" height="6" rx="1.5" fill="#2B6AE8" opacity="0.8"/>
  <rect x="79" y="18" width="5" height="5" rx="1"   fill="#5090F0" opacity="0.7"/>
  <rect x="88" y="6"  width="5" height="5" rx="1"   fill="#5090F0" opacity="0.6"/>
  <rect x="84" y="24" width="4" height="4" rx="1"   fill="#2B6AE8" opacity="0.5"/>
  <!-- Book arc bottom -->
  <path d="M 12 91 Q 50 100 88 91" stroke="#0D1E6A" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M 22 87 Q 50 95 78 87" stroke="#0D1E6A" stroke-width="1.5"
        fill="none" stroke-linecap="round" opacity="0.4"/>
</svg>
