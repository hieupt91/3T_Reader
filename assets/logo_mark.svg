<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- "3": orange-gold gradient (objectBoundingBox relative to each path) -->
  <linearGradient id="g3" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#FFE04A"/>
    <stop offset="0.35" stop-color="#FF8E00"/>
    <stop offset="1" stop-color="#C84000"/>
  </linearGradient>
  <radialGradient id="g3sh" cx="0.25" cy="0.18" r="0.5">
    <stop offset="0" stop-color="#FFFFC0" stop-opacity="0.5"/>
    <stop offset="1" stop-color="#FFFFC0" stop-opacity="0"/>
  </radialGradient>
  <!-- "T": silver-blue metallic -->
  <linearGradient id="gT" x1="0.1" y1="0" x2="0.5" y2="1">
    <stop offset="0" stop-color="#D8EEFF"/>
    <stop offset="0.5" stop-color="#90B8E8"/>
    <stop offset="1" stop-color="#4E78B8"/>
  </linearGradient>
  <linearGradient id="gTsh" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
    <stop offset="0.4" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <filter id="fCard" x="-12%" y="-12%" width="124%" height="124%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1030A0" flood-opacity="0.15"/>
  </filter>
  <filter id="f3" x="-15%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="3" dy="4" stdDeviation="5" flood-color="#882000" flood-opacity="0.5"/>
  </filter>
  <filter id="fT" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#001080" flood-opacity="0.28"/>
  </filter>
</defs>

<!-- White card -->
<rect x="8" y="8" width="240" height="240" rx="48" fill="#ffffff" filter="url(#fCard)"/>
<rect x="8" y="8" width="240" height="240" rx="48" fill="none" stroke="rgba(30,80,200,0.09)" stroke-width="1.5"/>

<!-- Diagonal speed slash -->
<line x1="138" y1="20" x2="98" y2="234" stroke="#0a1854" stroke-width="5" stroke-linecap="round" opacity="0.48"/>

<!-- "T" behind: bold italic T shape, silver-blue -->
<g transform="translate(0 128) skewX(-8) translate(0 -128)">
  <!-- T crossbar + stem, base at y=193, top y=63, x range ~116-220 -->
  <path d="M116,63 L220,63 L220,91 L178,91 L178,193 L158,193 L158,91 L116,91 Z"
        fill="url(#gT)" filter="url(#fT)"/>
  <path d="M116,63 L220,63 L220,91 L178,91 L178,193 L158,193 L158,91 L116,91 Z"
        fill="url(#gTsh)"/>
</g>

<!-- "3" in front: bold italic 3 shape, orange-gold -->
<g transform="translate(0 128) skewX(-8) translate(0 -128)">
  <!-- Hand-crafted bold "3", top-left at (40,63), bottom-right near (130,193) -->
  <path d="
    M 50,63
    Q 103,60 108,88
    Q 112,110 87,126
    Q 112,135 110,163
    Q 106,193 50,193
    L 50,176
    Q 84,176 85,162
    Q 87,147 67,140
    L 87,127
    Q 67,127 67,113
    Q 67,100 84,97
    Q 98,95 97,82
    Q 94,70 50,72
    Z"
        fill="url(#g3)" filter="url(#f3)"/>
  <path d="
    M 50,63
    Q 103,60 108,88
    Q 112,110 87,126
    Q 112,135 110,163
    Q 106,193 50,193
    L 50,176
    Q 84,176 85,162
    Q 87,147 67,140
    L 87,127
    Q 67,127 67,113
    Q 67,100 84,97
    Q 98,95 97,82
    Q 94,70 50,72
    Z"
        fill="url(#g3sh)"/>
</g>

<!-- Orange pixel scatter: near "3" bottom-left -->
<rect x="14"  y="182" width="16" height="16" rx="3.5" fill="#FF8C00"/>
<rect x="8"   y="202" width="12" height="12" rx="2.5" fill="#FF9200" opacity="0.75"/>
<rect x="30"  y="210" width="9"  height="9"  rx="2"   fill="#FFB800" opacity="0.65"/>
<rect x="10"  y="220" width="10" height="10" rx="2"   fill="#FF6800" opacity="0.5"/>
<rect x="24"  y="224" width="7"  height="7"  rx="1.5" fill="#FFCA00" opacity="0.4"/>

<!-- Blue pixel scatter: near "T" top-right -->
<rect x="208" y="48"  width="16" height="16" rx="3.5" fill="#2878FF"/>
<rect x="226" y="66"  width="12" height="12" rx="2.5" fill="#2878FF" opacity="0.75"/>
<rect x="209" y="86"  width="9"  height="9"  rx="2"   fill="#50A0FF" opacity="0.65"/>
<rect x="228" y="44"  width="10" height="10" rx="2"   fill="#1A60E0" opacity="0.55"/>
<rect x="226" y="94"  width="7"  height="7"  rx="1.5" fill="#3888FF" opacity="0.4"/>
</svg>
