<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Nền gradient cam-đỏ -->
  <linearGradient id="bgMain" x1="0" y1="0" x2="0.6" y2="1">
    <stop offset="0"   stop-color="#FF9A00"/>
    <stop offset="0.5" stop-color="#FF6200"/>
    <stop offset="1"   stop-color="#E63500"/>
  </linearGradient>
  <!-- Ánh sáng trên nền -->
  <linearGradient id="bgShine" x1="0" y1="0" x2="0.3" y2="0.6">
    <stop offset="0"   stop-color="#ffffff" stop-opacity="0.25"/>
    <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <!-- Dải accent xanh góc dưới-phải -->
  <linearGradient id="accentBlue" x1="0.5" y1="0.5" x2="1" y2="1">
    <stop offset="0"   stop-color="#1A5FE8" stop-opacity="0.9"/>
    <stop offset="1"   stop-color="#0A30A0" stop-opacity="0.9"/>
  </linearGradient>
  <!-- Shadow card -->
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#220800" flood-opacity="0.45"/>
  </filter>
</defs>

<!-- Nền bo tròn -->
<rect x="4" y="4" width="248" height="248" rx="50" fill="url(#bgMain)" filter="url(#shadow)"/>
<!-- Ánh sáng -->
<rect x="4" y="4" width="248" height="248" rx="50" fill="url(#bgShine)"/>
<!-- Viền mỏng -->
<rect x="4" y="4" width="248" height="248" rx="50" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

<!-- Dải accent xanh góc dưới-phải (tam giác) -->
<path d="M256,180 L256,256 L180,256 Q200,256 256,200 Z" fill="url(#accentBlue)" opacity="0.7" clip-path="inset(0 0 0 0 round 50px)"/>
<clipPath id="cardClip"><rect x="4" y="4" width="248" height="248" rx="50"/></clipPath>
<path d="M256,190 L256,256 L190,256 Z" fill="url(#accentBlue)" opacity="0.75" clip-path="url(#cardClip)"/>

<!-- Chữ "3T" trắng, to, đậm, căn giữa -->
<text
  x="128" y="162"
  font-family="'Segoe UI Black','Arial Black','Helvetica Neue',sans-serif"
  font-size="118"
  font-weight="900"
  fill="white"
  text-anchor="middle"
  letter-spacing="-4"
  style="paint-order:stroke; stroke:#E63500; stroke-width:3; stroke-opacity:0.4;"
>3T</text>

<!-- Đường gạch cam nhạt dưới chữ -->
<rect x="68" y="178" width="120" height="6" rx="3" fill="rgba(255,255,255,0.35)"/>
</svg>
