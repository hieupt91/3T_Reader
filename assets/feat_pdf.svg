<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
    <stop offset="0" stop-color="#15803d"/>
    <stop offset="1" stop-color="#14532d"/>
  </linearGradient>
  <linearGradient id="bgHL" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.14"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="doc" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#d1fae5"/>
    <stop offset="1" stop-color="#a7f3d0"/>
  </linearGradient>
  <linearGradient id="badge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff9800"/>
    <stop offset="1" stop-color="#f05a28"/>
  </linearGradient>
  <filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/></filter>
  <filter id="ds"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#003" flood-opacity="0.2"/></filter>
</defs>
<!-- Card -->
<rect width="64" height="64" rx="16" fill="url(#bg)" filter="url(#s)"/>
<rect width="64" height="64" rx="16" fill="url(#bgHL)"/>
<!-- Document body -->
<rect x="15" y="9" width="28" height="35" rx="4" fill="url(#doc)" filter="url(#ds)"/>
<!-- Fold corner -->
<path d="M35 9 L43 17 L35 17 Z" fill="rgba(255,255,255,0.5)"/>
<path d="M35 9 L43 9 L43 17 Z" fill="rgba(0,80,0,0.15)"/>
<!-- Lines on doc -->
<rect x="19" y="21" width="13" height="2" rx="1" fill="rgba(21,128,61,0.5)"/>
<rect x="19" y="26" width="19" height="2" rx="1" fill="rgba(21,128,61,0.4)"/>
<rect x="19" y="31" width="16" height="2" rx="1" fill="rgba(21,128,61,0.4)"/>
<!-- PDF badge -->
<rect x="13" y="39" width="26" height="13" rx="6" fill="url(#badge)"/>
<text x="26" y="49.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif"
      font-size="8.5" font-weight="900" fill="#fff" letter-spacing="0.5">PDF</text>
</svg>
