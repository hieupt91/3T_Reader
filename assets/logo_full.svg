<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="420" height="110">
  <defs>
    <linearGradient id="og" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#FFD000"/>
      <stop offset="55%" stop-color="#FF7700"/>
      <stop offset="100%" stop-color="#FF4400"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4FCC"/>
      <stop offset="100%" stop-color="#0D1E6A"/>
    </linearGradient>
  </defs>
  <!-- 3T mark -->
  <text x="2" y="86" font-family="Arial Black, Helvetica, sans-serif" font-weight="900"
        font-size="90" fill="url(#og)" letter-spacing="-3">3</text>
  <text x="55" y="86" font-family="Arial Black, Helvetica, sans-serif" font-weight="900"
        font-size="90" fill="url(#bg)" letter-spacing="-3">T</text>
  <!-- Pixel dots -->
  <rect x="118" y="8"  width="9"  height="9"  rx="2" fill="#2B6AE8" opacity="0.9"/>
  <rect x="132" y="16" width="8"  height="8"  rx="2" fill="#2B6AE8" opacity="0.8"/>
  <rect x="121" y="22" width="6"  height="6"  rx="1" fill="#5090F0" opacity="0.7"/>
  <rect x="131" y="5"  width="6"  height="6"  rx="1" fill="#5090F0" opacity="0.6"/>
  <rect x="128" y="30" width="5"  height="5"  rx="1" fill="#2B6AE8" opacity="0.5"/>
  <!-- Book arc -->
  <path d="M 8 102 Q 77 112 145 102" stroke="#0D1E6A" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <!-- Divider -->
  <line x1="162" y1="12" x2="162" y2="98" stroke="#D0D0E0" stroke-width="1.5"/>
  <!-- READER text -->
  <text x="178" y="72" font-family="Arial Black, Helvetica, sans-serif" font-weight="900"
        font-size="46" fill="#0D1E6A" letter-spacing="5">READER</text>
  <!-- Orange accent dashes -->
  <rect x="178" y="82" width="28" height="3" rx="1.5" fill="#FF6600"/>
  <rect x="360" y="82" width="28" height="3" rx="1.5" fill="#FF6600"/>
  <!-- Tagline -->
  <text x="180" y="100" font-family="Arial, Helvetica, sans-serif" font-size="11.5"
        fill="#6677AA" letter-spacing="2.5" font-weight="600">ĐỌC MỌI LÚC – HIỂU MỌI NƠI</text>
</svg>
