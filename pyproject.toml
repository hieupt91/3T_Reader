[project]
name = "3t-reader"
version = "1.0.2"
description = "3T Reader desktop foundation for Windows and macOS"
requires-python = ">=3.11,<3.14"
readme = "README.md"
authors = [
  { name = "3T Company" }
]

# Phase 0.4 switches the target UI binding to PySide6 and removes the
# GPL pdfjs-viewer-pyqt6 wrapper from app code.
dependencies = [
  "PySide6==6.11.0",
  "pyqtdarktheme",
  "pypdfium2==5.7.0",
  "pikepdf==10.5.1",
  "pyHanko==0.34.1",
  "python-pkcs11",
  "cryptography==46.0.7",
  "Pillow==12.2.0",
  "requests==2.33.1",
]

[project.optional-dependencies]
legacy-pymupdf = [
  "PyMuPDF==1.27.2.2",
]
legacy-pykcs11 = [
  "PyKCS11==1.5.18",
]
build = [
  "pyinstaller==6.20.0",
]
dev = [
  "pip-licenses",
  "cyclonedx-bom",
]
[tool.3t-reader.phase0]
commercial_release_blockers = [
  "Complete PySide6/LGPL compliance notices and packaging review.",
  "Keep pdfjs-viewer-pyqt6 out of commercial builds.",
  "Complete pypdfium2/pikepdf replacement for edit operations before dropping PyMuPDF prototype engine.",
  "Keep PyKCS11 out of primary dependencies and commercial builds.",
  "Complete asset provenance and notices.",
]
