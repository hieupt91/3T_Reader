[project]
name = "3t-reader"
# app/version.py is the single source of truth (3T_Reader.spec reads it
# directly via exec() at build time; nothing in this codebase reads the
# version field below). Update this manually alongside app/version.py when
# bumping releases - nothing enforces the two staying in sync automatically.
version = "1.0.27"
description = "3T Reader desktop foundation for Windows and macOS"
requires-python = ">=3.11"
readme = "README.md"
authors = [
  { name = "3T Company" }
]

# Phase 0.4 switches the target UI binding to PySide6 and removes the
# GPL pdfjs-viewer-pyqt6 wrapper from app code.
dependencies = [
  "PySide6==6.11.0",
  "pyqtdarktheme==0.1.7",
  "pypdfium2==5.7.0",
  "pikepdf==10.5.1",
  "reportlab==4.4.5",
  "pyHanko==0.34.1",
  "python-pkcs11==0.9.4",
  "cryptography==46.0.7",
  "Pillow==12.2.0",
  "requests==2.33.1",
  "pytesseract>=0.3.13",
  "pdf2docx>=0.5.8",
  "pdfplumber>=0.11.0",
  "openpyxl>=3.1.0",
  "numpy>=1.24.0",
  "pyttsx3==2.90",
]

[project.optional-dependencies]
ai = [
  "anthropic>=0.25.0",
  "openai>=1.30.0",
  "huggingface_hub>=0.25.0",
  "google-genai>=0.1.0",
]
legacy-pymupdf = [
  "PyMuPDF==1.27.2.2",
]
legacy-pykcs11 = [
  "PyKCS11==1.5.18",
]
build = [
  "pyinstaller==6.20.0",
]
dev = [
  "pip-licenses",
  "cyclonedx-bom",
  "sphinx",
  "sphinx-rtd-theme",
]
[tool.3t-reader.phase0]
commercial_release_blockers = [
  "Complete PySide6/LGPL compliance notices and packaging review.",
  "Keep pdfjs-viewer-pyqt6 out of commercial builds.",
  "Verify pypdfium2/pikepdf/reportlab PDF edit pipeline with fixture tests.",
  "Keep PyKCS11 out of primary dependencies and commercial builds.",
  "Complete asset provenance and notices.",
]
