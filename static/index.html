<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>3T Reader</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #07111f;
            --surface: rgba(14, 25, 43, 0.78);
            --surface-soft: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f5f8fc;
            --muted: #92a5c5;
            --primary: #2f8cff;
            --primary-2: #54d2ff;
            --success: #16b364;
            --danger: #d92d20;
            --warning: #f79009;
            --radius-xl: 28px;
            --radius-lg: 22px;
            --radius-md: 16px;
            --shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
        }

        body[data-theme="light"] {
            --bg: #eef5fb;
            --surface: rgba(255, 255, 255, 0.88);
            --surface-soft: rgba(19, 47, 88, 0.05);
            --border: rgba(18, 43, 76, 0.1);
            --text: #12253d;
            --muted: #5f7391;
            --primary: #1f7bf2;
            --primary-2: #0ea5e9;
            --shadow: 0 18px 60px rgba(36, 66, 110, 0.14);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: "Manrope", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(84, 210, 255, 0.14), transparent 24%),
                radial-gradient(circle at 85% 15%, rgba(47, 140, 255, 0.14), transparent 26%),
                linear-gradient(180deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 90%, #10203a 10%) 100%);
            min-height: 100vh;
            transition: background 0.25s ease, color 0.25s ease;
        }
        body[data-theme="light"] {
            background:
                radial-gradient(circle at top left, rgba(14, 165, 233, 0.1), transparent 24%),
                radial-gradient(circle at 85% 15%, rgba(59, 130, 246, 0.1), transparent 26%),
                linear-gradient(180deg, #f8fbff 0%, #eaf1f8 100%);
        }

        a { color: inherit; text-decoration: none; }
        button, input, select { font: inherit; }
        .container { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }
        .glass { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); backdrop-filter: blur(18px); }
        .hero-font, h1, h2, h3, .brand { font-family: "Space Grotesk", sans-serif; letter-spacing: -0.03em; }
        .muted { color: var(--muted); }
        .hidden { display: none !important; }

        nav {
            position: sticky; top: 0; z-index: 20;
            backdrop-filter: blur(18px);
            background: color-mix(in srgb, var(--bg) 72%, transparent 28%);
            border-bottom: 1px solid var(--border);
        }
        .nav-inner {
            display: flex; align-items: center; justify-content: space-between;
            gap: 18px; padding: 16px 0;
        }
        .brand {
            display: flex; align-items: center; gap: 12px;
            font-size: 28px; font-weight: 700;
        }
        .brand-badge {
            width: 46px; height: 46px; border-radius: 15px;
            display: inline-flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
            color: white;
        }
        .nav-links { display: flex; align-items: center; gap: 20px; }
        .nav-links a { color: var(--muted); font-weight: 700; }
        .nav-actions { display: flex; align-items: center; gap: 10px; }
        .chip {
            border: 1px solid var(--border);
            background: var(--surface-soft);
            color: var(--text);
            border-radius: 999px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 700;
        }
        .chip.active { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%); color: white; border-color: transparent; }

        .hero {
            padding: 58px 0 34px;
            display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 22px;
        }
        .hero-card, .hero-side {
            border-radius: var(--radius-xl);
            padding: 34px;
        }
        .hero-kicker {
            display: inline-flex; gap: 8px; align-items: center;
            border-radius: 999px; padding: 8px 12px;
            background: rgba(255,255,255,0.08);
            color: #d7eeff; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
        }
        body[data-theme="light"] .hero-kicker { background: rgba(18,43,76,0.06); color: #1f7bf2; }
        .hero h1 { font-size: clamp(42px, 6vw, 72px); line-height: 0.94; margin: 18px 0 18px; }
        .hero h1 span { color: var(--primary-2); }
        .hero p { font-size: 17px; line-height: 1.75; color: var(--muted); max-width: 720px; }
        .hero-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
        .btn, .btn-alt {
            border: none; border-radius: 999px; cursor: pointer; padding: 14px 18px; font-weight: 800;
        }
        .btn { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%); color: white; }
        .btn-alt { background: var(--surface-soft); color: var(--text); border: 1px solid var(--border); }

        .hero-side { display: grid; gap: 14px; align-content: start; }
        .metric {
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            background: var(--surface-soft);
            border: 1px solid var(--border);
        }
        .metric strong { display: block; font-size: 32px; }
        .metric span { color: var(--muted); }

        .downloads, .features, .pricing { padding: 28px 0; }
        .section-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 18px; }
        .section-head h2 { font-size: 36px; }
        .section-head p { color: var(--muted); max-width: 680px; }

        .download-grid, .feature-grid, .pricing-grid { display: grid; gap: 18px; }
        .download-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .feature-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .pricing-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .download-card, .feature-card, .pricing-card {
            border-radius: var(--radius-lg);
            padding: 24px;
        }
        .download-card h3, .feature-card h3, .pricing-card h3 { font-size: 24px; margin-bottom: 10px; }
        .download-card p, .feature-card p { color: var(--muted); line-height: 1.7; }
        .download-icon, .feature-icon {
            width: 58px; height: 58px; border-radius: 18px;
            display: inline-flex; align-items: center; justify-content: center;
            margin-bottom: 16px; font-size: 26px;
            background: rgba(255,255,255,0.08);
        }
        body[data-theme="light"] .download-icon, body[data-theme="light"] .feature-icon {
            background: rgba(18,43,76,0.06);
        }
        .download-meta { margin-top: 16px; font-size: 13px; color: var(--muted); }
        .download-card .btn, .pricing-card .btn, .pricing-card .btn-alt { margin-top: 18px; width: 100%; }

        .price {
            font-size: 44px; font-weight: 700; margin: 10px 0 6px;
            font-family: "Space Grotesk", sans-serif;
        }
        .price small { font-size: 16px; color: var(--muted); font-family: "Manrope", sans-serif; }
        .pill {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 7px 10px; border-radius: 999px;
            font-size: 12px; font-weight: 800;
            background: rgba(84,210,255,0.12); color: var(--primary-2);
        }
        .feature-list { list-style: none; display: grid; gap: 10px; margin-top: 18px; }
        .feature-list li { display: flex; align-items: flex-start; gap: 10px; color: var(--muted); }
        .feature-list i { margin-top: 4px; color: var(--success); }
        .pricing-card.highlight { border: 1px solid rgba(84, 210, 255, 0.24); transform: translateY(-4px); }

        footer {
            padding: 36px 0 48px;
            color: var(--muted);
        }
        .footer-bar { display: flex; justify-content: space-between; gap: 18px; align-items: center; }

        .overlay {
            position: fixed; inset: 0; z-index: 60;
            display: none; align-items: center; justify-content: center; padding: 24px;
        }
        .overlay.open { display: flex; }
        .overlay-bg { position: absolute; inset: 0; background: rgba(3, 9, 18, 0.72); backdrop-filter: blur(10px); }
        .modal {
            position: relative; z-index: 1;
            width: min(920px, 100%);
            border-radius: var(--radius-xl);
            padding: 28px;
            display: grid; grid-template-columns: 0.94fr 1.06fr; gap: 20px;
        }
        .modal-close {
            position: absolute; top: 18px; right: 18px;
            width: 42px; height: 42px; border: none; border-radius: 999px;
            background: var(--surface-soft); color: var(--text); cursor: pointer;
        }
        .pay-box, .form-box {
            border-radius: var(--radius-lg);
            padding: 22px;
            background: var(--surface-soft);
            border: 1px solid var(--border);
        }
        .plan-summary {
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
            border-radius: var(--radius-md);
            padding: 16px 18px; margin-bottom: 18px;
            background: rgba(84,210,255,0.1); border: 1px solid rgba(84,210,255,0.18);
        }
        .qr-wrap {
            background: white; border-radius: 18px; padding: 12px; width: fit-content; margin: 0 auto 18px;
        }
        .qr-wrap img { width: 190px; height: 190px; display: block; }
        .bank-grid { display: grid; gap: 10px; }
        .bank-row {
            display: flex; justify-content: space-between; gap: 12px; align-items: center;
            padding: 10px 0; border-bottom: 1px solid var(--border);
        }
        .bank-row:last-child { border-bottom: none; }
        .bank-row small { color: var(--muted); }
        .copy-btn {
            border: none; cursor: pointer; border-radius: 999px;
            padding: 6px 10px; font-size: 12px; font-weight: 800;
            background: rgba(84,210,255,0.14); color: var(--primary);
        }
        .note-box, .promo-box {
            margin-top: 16px; border-radius: var(--radius-md);
            padding: 14px 16px; line-height: 1.65; color: var(--muted);
            background: rgba(247, 144, 9, 0.08); border: 1px solid rgba(247, 144, 9, 0.16);
        }
        .form-box { display: grid; gap: 14px; }
        .field { display: grid; gap: 8px; }
        .field label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 800; }
        .field input, .field select {
            width: 100%; border-radius: 14px; border: 1px solid var(--border);
            background: rgba(255,255,255,0.06); color: var(--text); padding: 13px 14px; outline: none;
        }
        body[data-theme="light"] .field input, body[data-theme="light"] .field select { background: rgba(255,255,255,0.95); }
        .inline-row { display: grid; grid-template-columns: 1fr 140px; gap: 12px; }
        .promo-status {
            font-size: 13px; font-weight: 700;
            color: var(--success);
        }
        .promo-status.error { color: var(--danger); }
        .success-box {
            text-align: center; padding: 42px 20px;
        }
        .success-box i { font-size: 68px; color: var(--success); margin-bottom: 16px; }

        .ambient {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }
        .ambient::before,
        .ambient::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            filter: blur(18px);
            opacity: 0.9;
            animation: blobFloat 15s ease-in-out infinite;
        }
        .ambient::before {
            width: 460px;
            height: 460px;
            top: 70px;
            left: -140px;
            background: radial-gradient(circle, rgba(84, 210, 255, 0.22) 0%, rgba(84, 210, 255, 0) 72%);
        }
        .ambient::after {
            width: 520px;
            height: 520px;
            top: 160px;
            right: -160px;
            background: radial-gradient(circle, rgba(247, 144, 9, 0.16) 0%, rgba(247, 144, 9, 0) 70%);
            animation-delay: -6s;
        }
        @keyframes blobFloat {
            0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
            50% { transform: translate3d(18px, -20px, 0) scale(1.06); }
        }
        @keyframes floatY {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        .reveal {
            opacity: 0;
            transform: translateY(28px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }
        .reveal.in-view {
            opacity: 1;
            transform: translateY(0);
        }

        nav {
            margin-top: 14px;
            border: 1px solid var(--border);
            border-radius: 24px;
            width: min(1220px, calc(100% - 32px));
            margin-left: auto;
            margin-right: auto;
            top: 14px;
            box-shadow: 0 16px 46px rgba(3, 8, 20, 0.16);
        }
        .nav-inner { padding: 14px 20px; }
        .nav-links a {
            padding: 10px 12px;
            border-radius: 999px;
            transition: 0.2s ease;
        }
        .nav-links a:hover {
            color: var(--text);
            background: var(--surface-soft);
        }

        .hero {
            padding: 54px 0 28px;
            grid-template-columns: 1.02fr 0.98fr;
            gap: 24px;
            align-items: stretch;
        }
        .hero-card {
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at top right, rgba(84, 210, 255, 0.16), transparent 28%),
                linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
        }
        .hero-card::after {
            content: "";
            position: absolute;
            inset: auto -120px -130px auto;
            width: 360px;
            height: 360px;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(47, 140, 255, 0.2) 0%, rgba(47, 140, 255, 0) 70%);
            pointer-events: none;
        }
        .hero-copy {
            position: relative;
            z-index: 1;
        }
        .hero-copy > * {
            animation: floatY 7s ease-in-out infinite;
        }
        .hero-copy > *:nth-child(2) { animation-delay: -1s; }
        .hero-copy > *:nth-child(3) { animation-delay: -2s; }
        .hero h1 {
            font-size: clamp(46px, 6vw, 78px);
            line-height: 0.92;
            max-width: 760px;
        }
        .hero h1 span {
            display: inline-block;
            color: #8ce1ff;
            text-shadow: 0 0 30px rgba(84, 210, 255, 0.2);
        }
        body[data-theme="light"] .hero h1 span {
            color: #0c7fdd;
            text-shadow: none;
        }
        .hero-cta {
            align-items: center;
            gap: 14px;
        }
        .hero-subline {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 22px;
        }
        .micro-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #d9e6f8;
            font-size: 13px;
            font-weight: 700;
        }
        body[data-theme="light"] .micro-pill {
            background: rgba(18, 43, 76, 0.05);
            border-color: rgba(18, 43, 76, 0.08);
            color: #274262;
        }

        .hero-side {
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.02) 100%),
                radial-gradient(circle at top left, rgba(247, 144, 9, 0.14), transparent 24%);
            grid-template-rows: auto auto 1fr;
        }
        .showcase-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        .showcase-top strong {
            font-family: "Space Grotesk", sans-serif;
            font-size: 24px;
        }
        .showcase-dots {
            display: inline-flex;
            gap: 6px;
        }
        .showcase-dots span {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: rgba(255,255,255,0.18);
        }
        .showcase-dots span:first-child { background: #fb7185; }
        .showcase-dots span:nth-child(2) { background: #f59e0b; }
        .showcase-dots span:nth-child(3) { background: #10b981; }
        .app-preview {
            position: relative;
            min-height: 390px;
            border-radius: 24px;
            padding: 18px;
            background: rgba(6, 15, 29, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }
        body[data-theme="light"] .app-preview {
            background: rgba(255,255,255,0.76);
            border-color: rgba(18, 43, 76, 0.08);
        }
        .app-preview::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(180deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 34px 34px;
            opacity: 0.28;
        }
        .preview-window {
            position: relative;
            z-index: 1;
            height: 100%;
            border-radius: 20px;
            background: linear-gradient(180deg, rgba(245,248,252,0.98) 0%, rgba(224,231,241,0.95) 100%);
            color: #112033;
            overflow: hidden;
            box-shadow: 0 24px 44px rgba(0, 0, 0, 0.16);
            animation: floatY 8s ease-in-out infinite;
        }
        .preview-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: linear-gradient(180deg, #eff5fb 0%, #dfe8f3 100%);
            border-bottom: 1px solid rgba(17, 32, 51, 0.08);
        }
        .preview-layout {
            display: grid;
            grid-template-columns: 84px 1fr;
            height: calc(100% - 53px);
        }
        .preview-rail {
            background: #e9eff6;
            border-right: 1px solid rgba(17, 32, 51, 0.08);
            padding: 14px 10px;
            display: grid;
            gap: 12px;
            align-content: start;
        }
        .rail-icon {
            height: 44px;
            border-radius: 14px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1f7bf2;
            box-shadow: 0 8px 18px rgba(37, 72, 120, 0.08);
        }
        .preview-main {
            padding: 18px;
            display: grid;
            gap: 16px;
            align-content: start;
        }
        .preview-toolbar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .tool-chip {
            border-radius: 14px;
            padding: 12px 10px;
            background: white;
            color: #36506e;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            box-shadow: 0 8px 18px rgba(37, 72, 120, 0.06);
            animation: floatY 6s ease-in-out infinite;
        }
        .tool-chip:nth-child(2) { animation-delay: -1.2s; }
        .tool-chip:nth-child(3) { animation-delay: -2.1s; }
        .tool-chip:nth-child(4) { animation-delay: -3s; }
        .preview-paper {
            border-radius: 18px;
            background: white;
            min-height: 220px;
            padding: 18px;
            box-shadow: inset 0 0 0 1px rgba(17, 32, 51, 0.06);
        }
        .preview-paper .line {
            height: 10px;
            border-radius: 999px;
            background: linear-gradient(90deg, #dae6f5 0%, #edf3fa 100%);
            margin-bottom: 10px;
        }
        .preview-paper .line.short { width: 42%; }
        .preview-paper .line.mid { width: 68%; }
        .preview-paper .line.long { width: 90%; }
        .floating-note {
            position: absolute;
            right: 18px;
            bottom: 22px;
            z-index: 3;
            width: 210px;
            padding: 16px;
            border-radius: 18px;
            background: rgba(8, 18, 32, 0.82);
            border: 1px solid rgba(255,255,255,0.08);
            color: #e6f3ff;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.24);
            animation: floatY 6.5s ease-in-out infinite;
        }
        .floating-note strong {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .floating-note span {
            font-size: 13px;
            line-height: 1.6;
            color: #bcd0ea;
        }
        .metrics-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }
        .metric {
            background: rgba(255,255,255,0.04);
            transition: transform 0.18s ease, border-color 0.18s ease;
        }
        .metric:hover {
            transform: translateY(-3px);
            border-color: rgba(84, 210, 255, 0.24);
        }
        .spotlight-strip {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 12px;
        }
        .spot-card {
            padding: 18px 20px;
            border-radius: 20px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            box-shadow: 0 20px 42px rgba(0, 0, 0, 0.1);
        }
        .spot-card strong {
            display: block;
            margin-bottom: 8px;
            font-size: 18px;
            font-family: "Space Grotesk", sans-serif;
        }
        .spot-card p {
            color: var(--muted);
            line-height: 1.7;
            font-size: 14px;
        }
        .trust-bar {
            display: grid;
            grid-template-columns: 0.95fr 2.05fr;
            gap: 18px;
            align-items: center;
            margin: 14px 0 22px;
            padding: 16px 18px;
            border-radius: 22px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
        }
        .trust-lead strong {
            display: block;
            font-size: 15px;
            margin-bottom: 4px;
            letter-spacing: 0.02em;
        }
        .trust-lead span {
            color: var(--muted);
            line-height: 1.6;
            font-size: 14px;
        }
        .trust-items {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }
        .trust-item {
            min-height: 88px;
            padding: 16px;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
            border: 1px solid var(--border);
            display: grid;
            gap: 8px;
            align-content: start;

        .trust-item strong {
            font-size: 15px;
        }
        .trust-item span {
            font-size: 13px;
            line-height: 1.6;
            color: var(--muted);
        }
        .editorial-band {
            display: grid;
            grid-template-columns: 1.04fr 0.96fr;
            gap: 18px;
            margin: 10px 0 8px;
        }
        .editorial-main,
        .editorial-side {
            padding: 28px;
            border-radius: 26px;
        }
        .section-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(84,210,255,0.1);
            color: #9de7ff;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        body[data-theme="light"] .section-tag {
            color: #0e88dc;
            background: rgba(14,136,220,0.08);
        }
        .editorial-main h2,
        .editorial-side h3 {
            font-size: clamp(28px, 4vw, 42px);
            line-height: 1.02;
            margin-bottom: 12px;
        }
        .editorial-main p,
        .editorial-side p {
            color: var(--muted);
            line-height: 1.82;
        }
        .editorial-points {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 20px;
        }
        .editorial-point {
            padding: 16px;
            border-radius: 18px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
        }
        .editorial-point strong {
            display: block;
            font-size: 15px;
            margin-bottom: 6px;
        }
        .editorial-point span {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.65;
        }
        .editorial-stack {
            display: grid;
            gap: 12px;
            margin-top: 18px;
        }
        .editorial-step {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            padding: 16px;
            border-radius: 18px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
        }
        .editorial-step b {
            min-width: 34px;
            height: 34px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
            color: white;
            font-size: 14px;
        }
        .editorial-step strong {
            display: block;
            margin-bottom: 4px;
        }
        .editorial-step span {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.65;
        }
        .download-card .topline,
        .pricing-card .topline {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }
        .soft-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 10px;
            border-radius: 999px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            font-size: 12px;
            font-weight: 800;
            color: var(--muted);
        }
        .download-card .btn,
        .download-card .btn-alt {
            margin-top: 22px;
        }
        .visual-gallery {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 18px;
            margin: 24px 0 16px;
        }
        .gallery-main,
        .gallery-stack {
            display: grid;
            gap: 18px;
        }
        .gallery-card {
            position: relative;
            overflow: hidden;
            padding: 24px;
            border-radius: 26px;
            min-height: 220px;
        }
        .gallery-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background-size: 200% 200%;
            animation: shimmer 9s linear infinite alternate;
            opacity: 0.95;
        }
        .gallery-card > * {
            position: relative;
            z-index: 1;
        }
        .gallery-card.primary::before {
            background-image:
                radial-gradient(circle at 20% 20%, rgba(84,210,255,0.24), transparent 24%),
                linear-gradient(135deg, rgba(9,18,34,0.9) 0%, rgba(19,34,61,0.88) 55%, rgba(9,18,34,0.96) 100%);
        }
        .gallery-card.secondary::before {
            background-image:
                radial-gradient(circle at 80% 20%, rgba(247,144,9,0.24), transparent 26%),
                linear-gradient(135deg, rgba(16,27,45,0.94) 0%, rgba(18,44,62,0.84) 100%);
        }
        .gallery-card.tertiary::before {
            background-image:
                radial-gradient(circle at 25% 25%, rgba(16,185,129,0.22), transparent 26%),
                linear-gradient(135deg, rgba(12,24,39,0.95) 0%, rgba(17,33,56,0.86) 100%);
        }
        .gallery-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .gallery-card h3 {
            font-size: clamp(28px, 4vw, 44px);
            margin: 18px 0 10px;
            max-width: 420px;
            line-height: 0.98;
        }
        .gallery-card p {
            max-width: 420px;
            color: rgba(232,240,251,0.78);
            line-height: 1.75;
        }
        .gallery-mini {
            position: absolute;
            right: 18px;
            bottom: 18px;
            display: grid;
            gap: 10px;
            width: 180px;
        }
        .gallery-chip {
            padding: 12px 14px;
            border-radius: 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            font-size: 13px;
            font-weight: 700;
            animation: floatY 7s ease-in-out infinite;
        }
        .gallery-chip:nth-child(2) { animation-delay: -1.8s; }
        .gallery-chip:nth-child(3) { animation-delay: -3s; }
        .gallery-stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            gap: 12px;
        }
        .gallery-stat strong {
            font-size: 30px;
        }
        .gallery-stat span {
            color: rgba(232,240,251,0.72);
            font-size: 13px;
        }

        .download-card,
        .feature-card,
        .pricing-card {
            position: relative;
            overflow: hidden;
            transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
        }
        .download-card:hover,
        .feature-card:hover,
        .pricing-card:hover {
            transform: translateY(-6px);
            border-color: rgba(84, 210, 255, 0.22);
        }
        .download-card::after,
        .feature-card::after,
        .pricing-card::after {
            content: "";
            position: absolute;
            inset: auto -60px -80px auto;
            width: 180px;
            height: 180px;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(84, 210, 255, 0.12) 0%, rgba(84, 210, 255, 0) 70%);
            pointer-events: none;
        }
        .pricing-card {
            padding-top: 28px;
        }
        .pricing-card.highlight {
            border: 1px solid rgba(84, 210, 255, 0.32);
            box-shadow: 0 26px 70px rgba(11, 29, 55, 0.28);
            background:
                linear-gradient(180deg, rgba(84,210,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
        }
        .price {
            font-size: 48px;
        }
        .cta-band {
            margin: 30px 0 36px;
            padding: 28px 30px;
            border-radius: 28px;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 18px;
            align-items: center;
            background:
                linear-gradient(135deg, rgba(47, 140, 255, 0.18) 0%, rgba(84, 210, 255, 0.08) 100%);
            border: 1px solid rgba(84, 210, 255, 0.18);
        }
        .cta-band h2 {
            font-size: clamp(28px, 4vw, 42px);
            margin-bottom: 10px;
        }
        .cta-band p {
            color: var(--muted);
            line-height: 1.8;
        }
        .cta-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            flex-wrap: wrap;
        }

        @media (max-width: 980px) {
            .hero, .modal { grid-template-columns: 1fr; }
            .download-grid, .feature-grid, .pricing-grid { grid-template-columns: 1fr; }
            .spotlight-strip, .metrics-row, .cta-band, .trust-bar, .editorial-band, .trust-items, .editorial-points, .visual-gallery { grid-template-columns: 1fr; }
            .cta-actions { justify-content: flex-start; }
        }
        @media (max-width: 760px) {
            .nav-links { display: none; }
            .hero { padding-top: 28px; }
            .section-head, .footer-bar { display: grid; }
            .inline-row { grid-template-columns: 1fr; }
            nav {
                width: calc(100% - 20px);
                top: 10px;
            }
            .container { width: min(1180px, calc(100% - 22px)); }
            .hero-card, .hero-side, .download-card, .feature-card, .pricing-card, .cta-band {
                padding: 22px;
            }
            .preview-layout { grid-template-columns: 64px 1fr; }
            .preview-toolbar { grid-template-columns: repeat(2, 1fr); }
            .floating-note {
                position: static;
                width: 100%;
                margin-top: 14px;
            }
            .gallery-mini {
                position: static;
                width: 100%;
                margin-top: 18px;
            }
        }
    </style>
</head>

        const PLAN_NAMES = {
            vi: {
                basic: "Gói Cơ bản",
                personal: "Gói Cá nhân",

        const planStyle = {
            basic: { button: "btn-alt", icon: "fa-seedling" },
            personal: { button: "btn", icon: "fa-user" },
            enterprise: { button: "btn-alt", icon: "fa-building" }
        };

        let currentLang = localStorage.getItem("reader_lang") || "vi";
        let currentTheme = localStorage.getItem("reader_theme") || "dark";
        let siteConfig = null;
        let currentPlan = "personal";
        let currentPromo = "";

        function t(key) {
            return I18N[currentLang][key] || key;
        }

        function fmtMoney(value) {
            return `${Number(value || 0).toLocaleString("vi-VN")}đ`;
        }

        function applyTheme() {
            document.body.setAttribute("data-theme", currentTheme);
            document.getElementById("theme-toggle").innerHTML = currentTheme === "light"
                ? '<i class="fa-solid fa-sun"></i>'
                : '<i class="fa-solid fa-moon"></i>';
        }

        function applyLanguage() {
            document.documentElement.lang = currentLang;
            document.getElementById("lang-toggle").textContent = currentLang === "vi" ? "EN" : "VI";
            document.querySelectorAll("[data-i18n]").forEach((node) => {
                node.innerHTML = t(node.dataset.i18n);
            });
            document.getElementById("hero-title").innerHTML = t("hero_title");
            document.getElementById("hero-subtitle").textContent = t("hero_subtitle");
            renderFeatures();
            renderPricing();
            renderPlanSelect();
            if (siteConfig) {
                updateDownloadCards();
                updateQuote();
            }
        }

        function renderFeatures() {
            document.getElementById("feature-grid").innerHTML = FEATURE_SETS[currentLang].map((item) => `
                <article class="feature-card glass">
                    <div class="feature-icon"><i class="fa-solid ${item.icon}"></i></div>
                    <h3>${item.title}</h3>
                    <p>${item.text}</p>
                </article>
            `).join("");
        }

        function renderPricing() {
            if (!siteConfig) return;
            const featuredPlan = "personal";
            document.getElementById("pricing-grid").innerHTML = siteConfig.plans.map((plan) => {
                const featured = plan.code === featuredPlan;
                const styles = planStyle[plan.code] || planStyle.personal;
                const planName = (PLAN_NAMES[currentLang] || {})[plan.code] || plan.name || plan.code;
                return `
                    <article class="pricing-card glass ${featured ? "highlight" : ""}">
                        ${featured ? `<span class="pill">${currentLang === "vi" ? "Đề xuất" : "Recommended"}</span>` : ""}
                        <h3>${planName}</h3>
                        <div class="price">${fmtMoney(plan.price)} <small>${t("year_machine")}</small></div>
                        <ul class="feature-list">
                            ${(PLAN_FEATURES[currentLang][plan.code] || []).map((line) => `<li><i class="fa-solid fa-check"></i><span>${line}</span></li>`).join("")}
                        </ul>
                        <button type="button" class="${styles.button}" onclick="openModal('${plan.code}')">${currentLang === "vi" ? "Mua gói này" : "Buy this plan"}</button>
                    </article>
                `;
            }).join("");
        }

        function updateDownloadCards() {
            document.getElementById("download-win").href = siteConfig.downloads.win.url || "#";
            document.getElementById("download-portable").href = siteConfig.downloads.portable.url || "#";
            document.getElementById("download-mac").href = siteConfig.downloads.mac.url || "#";
            document.getElementById("download-win-meta").textContent = t("download_version").replace("{version}", siteConfig.downloads.win.version || "-");
            document.getElementById("download-mac-meta").textContent = siteConfig.downloads.mac.version
                ? t("download_version").replace("{version}", siteConfig.downloads.mac.version)
                : t("no_mac");
        }

        function renderPlanSelect() {
            if (!siteConfig) return;
            const select = document.getElementById("plan-select");
            select.innerHTML = siteConfig.plans.map((plan) => `
                <option value="${plan.code}">${((PLAN_NAMES[currentLang] || {})[plan.code] || plan.name || plan.code)} - ${fmtMoney(plan.price)}</option>
            `).join("");
            select.value = currentPlan;
        }

        async function loadSiteConfig() {
            const res = await fetch("/api/public/site-config");
            siteConfig = await res.json();
            updateDownloadCards();
            applyLanguage();
        }

        function openModal(planCode) {
            currentPlan = planCode || currentPlan;
            currentPromo = "";
            document.getElementById("promo-code").value = "";
            document.getElementById("promo-status").textContent = t("promo_empty");
            document.getElementById("promo-status").classList.remove("error");
            document.getElementById("promo-detail").textContent = "";
            document.getElementById("plan-select").value = currentPlan;
            document.getElementById("quantity").value = 1;
            document.getElementById("pay-step1").classList.remove("hidden");
            document.getElementById("pay-step1-form").classList.remove("hidden");
            document.getElementById("pay-step2").classList.add("hidden");
            document.getElementById("pay-modal").classList.add("open");
            document.body.style.overflow = "hidden";
            updateQuote();
        }

        function closeModal() {
            document.getElementById("pay-modal").classList.remove("open");
            document.body.style.overflow = "";
        }

        async function updateQuote() {
            if (!siteConfig) return;
            currentPlan = document.getElementById("plan-select").value || currentPlan;
            const quantity = Math.max(1, Number(document.getElementById("quantity").value || 1));
            const email = document.getElementById("cust-email").value.trim();
            const customerName = document.getElementById("cust-name").value.trim();
            const promo = currentPromo || document.getElementById("promo-code").value.trim();
            const params = new URLSearchParams({
                plan: currentPlan,
                quantity: String(quantity),
                promo_code: promo,
                email,
                customer_name: customerName,
            });

            try {
                const res = await fetch(`/api/public/order-quote?${params.toString()}`);
                const quote = await res.json();
                if (!res.ok) throw new Error(quote.detail || t("promo_invalid"));

                const payment = quote.payment || {};
                const selectedPlan = siteConfig.plans.find((item) => item.code === currentPlan);
                const displayName = ((PLAN_NAMES[currentLang] || {})[currentPlan] || selectedPlan?.name || quote.plan_name);
                document.getElementById("ps-name").textContent = displayName;
                document.getElementById("ps-price").textContent = fmtMoney(quote.amount_total);
                document.getElementById("bank-name-value").textContent = payment.bank_name || "";
                document.getElementById("bank-account-value").textContent = payment.account_number || "";
                document.getElementById("bank-holder-value").textContent = payment.account_name || "";
                document.getElementById("bank-amount-value").textContent = fmtMoney(quote.amount_total);
                document.getElementById("transfer-note").textContent = quote.transfer_note || "";
                document.getElementById("payment-note-box").textContent = payment.payment_note || "";

                const promoStatus = document.getElementById("promo-status");
                const promoDetail = document.getElementById("promo-detail");
                if (quote.promo_code) {
                    promoStatus.textContent = `${t("promo_ok")}: ${quote.promo_code}`;
                    promoStatus.classList.remove("error");
                    promoDetail.textContent = `${quote.promo_label || quote.promo_code} • -${fmtMoney(quote.discount_amount)}`;
                } else {
                    promoStatus.textContent = t("promo_empty");
                    promoStatus.classList.remove("error");
                    promoDetail.textContent = "";
                }

                const bankCode = encodeURIComponent(payment.bank_code || "ACB");
                const account = encodeURIComponent(payment.account_number || "");
                const note = encodeURIComponent(quote.transfer_note || "");
                const accountName = encodeURIComponent(payment.account_name || "");
                document.getElementById("qr-img").src = `https://img.vietqr.io/image/${bankCode}-${account}-compact2.png?amount=${quote.amount_total}&addInfo=${note}&accountName=${accountName}`;
            } catch (error) {
                if (promo) {
                    const promoStatus = document.getElementById("promo-status");
                    promoStatus.textContent = error.message || t("promo_invalid");
                    promoStatus.classList.add("error");
                }
            }
        }

        async function applyPromo() {
            currentPromo = document.getElementById("promo-code").value.trim().toUpperCase();
            await updateQuote();
        }

        async function submitOrder(event) {
            event.preventDefault();
            const payload = {
                customer_name: document.getElementById("cust-name").value.trim(),
                customer_email: document.getElementById("cust-email").value.trim(),
                plan: document.getElementById("plan-select").value,
                quantity: Math.max(1, Number(document.getElementById("quantity").value || 1)),
                promo_code: (document.getElementById("promo-code").value || "").trim().toUpperCase(),
            };
            const btn = document.getElementById("submit-btn");
            btn.disabled = true;
            try {
                const res = await fetch("/api/v1/order/submit", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Submit failed");
                document.getElementById("pay-step1").classList.add("hidden");
                document.getElementById("pay-step1-form").classList.add("hidden");
                document.getElementById("pay-step2").classList.remove("hidden");
                document.getElementById("success-text").textContent = t("order_sent").replace("{email}", payload.customer_email);
            } catch (error) {
                alert(error.message || "Submit failed");
            } finally {
                btn.disabled = false;
            }
        }

        async function copyText(text) {
            try {
                await navigator.clipboard.writeText(text);
                alert(t("copied"));
            } catch {}
        }

        function initReveal() {
            const items = document.querySelectorAll(".reveal");
            if (!("IntersectionObserver" in window)) {
                items.forEach((item) => item.classList.add("in-view"));
                return;
            }
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("in-view");
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.14 });
            items.forEach((item) => observer.observe(item));
        }

        document.getElementById("theme-toggle").addEventListener("click", () => {
            currentTheme = currentTheme === "dark" ? "light" : "dark";
            localStorage.setItem("reader_theme", currentTheme);
            applyTheme();
        });
        document.getElementById("lang-toggle").addEventListener("click", () => {
            currentLang = currentLang === "vi" ? "en" : "vi";
            localStorage.setItem("reader_lang", currentLang);
            applyLanguage();
        });
        document.getElementById("plan-select").addEventListener("change", updateQuote);
        document.getElementById("quantity").addEventListener("input", updateQuote);
        document.getElementById("cust-email").addEventListener("input", updateQuote);
        document.getElementById("cust-name").addEventListener("input", updateQuote);
        document.getElementById("apply-promo").addEventListener("click", applyPromo);
        document.getElementById("order-form").addEventListener("submit", submitOrder);
        document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeModal(); });

        applyTheme();
        initReveal();
        loadSiteConfig();
    </script>
</body>
</html>
